{% set name = "durationpy" %}
{% set version = "0.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/durationpy-{{ version }}.tar.gz
  sha256: 181898e1ae282e288f0a2291829656bf1b6b3aadf30a97993b85db4943642905

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - durationpy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/icholy/durationpy
  summary: Module for converting between datetime.timedelta and Go's Duration strings.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
