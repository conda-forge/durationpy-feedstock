schema_version: 1

context:
  version: "0.12"

package:
  name: durationpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/durationpy/durationpy-${{ version }}.tar.gz
  sha256: 03e8223034b4a874c1c0022672aead4e6d7ed792bb418be3c5616f6494eb14cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - durationpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Module for converting between datetime.timedelta and Go's Duration strings.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/icholy/durationpy

extra:
  recipe-maintainers:
    - ocefpaf
